name: ci

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DQCSI_WERROR=ON

      # The compiler and linker diagnostics are copied into the job summary
      # and emitted as an annotation on failure. Both are readable on the run
      # page, so a broken build says what broke instead of only reporting an
      # exit code.
      - name: Build
        run: |
          set +e
          cmake --build build --parallel 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "### Build output"
              echo '```'
              tail -c 60000 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            python3 -c "import re;log=open('build.log',errors='replace').read();hits=[m.start() for m in re.finditer(r'error:|Error 1|undefined reference',log)];s=log[max(0,hits[0]-1000):hits[0]+2200] if hits else log[-2200:];print('::error title=Build failed::'+s.replace(chr(10),'%0A'))"
          fi
          exit "$status"

      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: ubsan + asan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Signed integer overflow is UB: on a fixed-point library UBSan is the
      # single most useful check there is.
      - name: Configure with sanitizers
        env:
          CC: clang
          CFLAGS: -fsanitize=address,undefined -fno-sanitize-recover=all -g
        run: cmake -S . -B build-san -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build-san --parallel

      - name: Test
        run: ctest --test-dir build-san --output-on-failure


  cost:
    name: cost report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Operation counts are deterministic: a change between two commits is a
      # cost regression, not measurement noise.
      - name: Configure
        run: >
          cmake -S . -B build-bench -DCMAKE_BUILD_TYPE=Release
          -DQCSI_PROFILE=ON -DQCSI_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build-bench --parallel

      - name: Run
        run: ./build-bench/bench/qcsi_bench | tee -a "$GITHUB_STEP_SUMMARY"

  readme:
    name: readme consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The quantisation table quotes raw counts and derived columns side by
      # side, so a table edited by hand and left half-updated is detectable
      # without needing the dataset.
      - name: Check the README tables against themselves
        run: python3 tools/check_readme.py
